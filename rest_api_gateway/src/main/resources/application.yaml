server:
  port: 8080

spring:
  application:
    name: rest-api-gateway

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        - id: cart-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/carts/**

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info