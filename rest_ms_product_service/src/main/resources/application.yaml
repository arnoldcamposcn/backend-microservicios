server:
  port: 8081

spring:
  application:
    name: rest-ms-product-service

  r2dbc:
    url: ${PRODUCT_DB_URL:r2dbc:postgresql://localhost:5432/ms_product_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info