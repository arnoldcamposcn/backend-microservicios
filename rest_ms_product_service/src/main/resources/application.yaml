server:
  port: 8081

spring:
  application:
    name: rest-ms-product-service

  r2dbc:
    url: ${PRODUCT_DB_URL:r2dbc:postgresql://localhost:5432/ms_product_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.restaurant.product.infrastructure.messaging.event.OrderCreatedEvent
        spring.json.trusted.packages: com.restaurant.product.infrastructure.messaging.event

management:
  endpoints:
    web:
      exposure:
        include: health,info